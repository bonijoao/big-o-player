<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big O Player</title>
<meta name="description" content="Algoritmos tocando ao vivo, com cada passo contado e conferido no R. Cada playlist é um problema, e cada faixa um jeito de resolvê-lo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<!-- os ícones do player -->
<svg class="so-leitor" aria-hidden="true">
  <symbol id="i-tocar" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></symbol>
  <symbol id="i-pausar" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/></symbol>
  <symbol id="i-passo-antes" viewBox="0 0 24 24"><rect x="4" y="5" width="2.4" height="14" fill="currentColor"/><path d="M19 5v14L8.5 12z" fill="currentColor"/></symbol>
  <symbol id="i-passo-depois" viewBox="0 0 24 24"><rect x="17.6" y="5" width="2.4" height="14" fill="currentColor"/><path d="M5 5v14l10.5-7z" fill="currentColor"/></symbol>
  <symbol id="i-faixa-antes" viewBox="0 0 24 24"><rect x="3" y="5" width="2.2" height="14" fill="currentColor"/><path d="M13 5v14L5.5 12zM21 5v14l-7.5-7z" fill="currentColor"/></symbol>
  <symbol id="i-faixa-depois" viewBox="0 0 24 24"><rect x="18.8" y="5" width="2.2" height="14" fill="currentColor"/><path d="M3 5v14l7.5-7zM11 5v14l7.5-7z" fill="currentColor"/></symbol>
  <symbol id="i-rampa" viewBox="0 0 20 14"><path d="M1 13L19 2M1 13h18" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
</svg>

<div class="app">
  <aside class="lateral">
    <a class="marca" href="#">Big O Player<span class="cursor" aria-hidden="true"></span></a>
    <nav id="secoes" aria-label="Seções"></nav>
  </aside>
  <main id="conteudo" tabindex="-1"></main>
</div>

<!-- o palco mora fora das rotas: trocar de página não interrompe a faixa -->
<div id="fundo" class="fundo" hidden></div>
<section id="palco" class="palco" data-modo="oculto" aria-label="Simulação da faixa" hidden>
  <div class="palco-barra">
    <span id="palco-titulo" class="palco-titulo"></span>
    <button type="button" id="palco-fluxo" class="botao-passo palco-fluxo" hidden>fluxograma</button>
    <button type="button" id="palco-modo" class="icone" aria-label="Minimizar"></button>
    <button type="button" id="palco-fechar" class="icone" aria-label="Fechar">×</button>
  </div>
  <div class="palco-corpo">
    <div class="palco-tela">
      <canvas id="tela" class="tela" role="img" aria-label="Animação do algoritmo"></canvas>
      <p id="palco-objetivo" class="palco-objetivo" hidden></p>
    </div>
    <div id="palco-vars" class="palco-vars" aria-label="Variáveis: a linha do pseudocódigo que está rodando e os valores da vez"></div>
  </div>
  <!-- embaixo do palco só a entrada do algoritmo; tocar, passos e velocidade são do rodapé -->
  <div class="palco-controles">
    <label class="so-ordenacao so-tipo"><span id="cfg-tipo-rotulo">entrada</span>
      <select id="cfg-tipo"></select>
    </label>
    <label class="so-ordenacao"><span id="cfg-n-rotulo">n</span>
      <select id="cfg-n"></select>
    </label>
    <label class="so-kmeans"><span id="cfg-k-rotulo">k</span>
      <select id="cfg-k"><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
    </label>
    <button type="button" id="cfg-sortear" class="botao-passo">embaralhar</button>
    <span class="ritmo so-estreito"><span class="vel" role="group" aria-label="Velocidade">
      <button type="button" class="icone" data-vel="-1" aria-label="Mais devagar" title="Mais devagar (−)">−</button>
      <output class="vel-valor">1×</output>
      <button type="button" class="icone" data-vel="1" aria-label="Mais rápido" title="Mais rápido (+)">+</button>
    </span>
    <button type="button" class="icone acelera" aria-pressed="false" aria-label="accelerando" title="accelerando: começa devagar e acelera"><svg aria-hidden="true"><use href="#i-rampa"/></svg></button></span>
  </div>
</section>

<!-- o fluxograma abre por cima de tudo, do encarte ou do palco; a faixa continua tocando -->
<dialog id="caixa-fluxo" class="caixa-fluxo" aria-labelledby="caixa-fluxo-titulo">
  <div class="caixa-barra">
    <h2 id="caixa-fluxo-titulo"></h2>
    <button type="button" id="caixa-fluxo-fechar" class="icone" aria-label="Fechar o fluxograma">×</button>
  </div>
  <div id="caixa-fluxo-corpo" class="caixa-corpo"></div>
</dialog>

<footer class="tocador" id="tocador" aria-label="Player">
  <a class="agora" id="agora" href="#">
    <span class="agora-capa" id="agora-capa"></span>
    <span class="agora-texto"><b id="agora-nome">Nada tocando</b><small id="agora-album">escolha uma faixa</small></span>
  </a>
  <div class="controles">
    <div class="botoes">
      <button type="button" id="anterior" class="icone faixa" aria-label="Faixa anterior"><svg aria-hidden="true"><use href="#i-faixa-antes"/></svg></button>
      <button type="button" id="passo-antes" class="icone" aria-label="Voltar um passo" title="Voltar um passo (←)"><svg aria-hidden="true"><use href="#i-passo-antes"/></svg></button>
      <button type="button" id="tocar" class="tocar" aria-label="Tocar" title="Tocar e pausar (espaço)"><svg aria-hidden="true"><use href="#i-tocar"/></svg></button>
      <button type="button" id="passo-depois" class="icone" aria-label="Avançar um passo" title="Avançar um passo (→)"><svg aria-hidden="true"><use href="#i-passo-depois"/></svg></button>
      <button type="button" id="proxima" class="icone faixa" aria-label="Próxima faixa"><svg aria-hidden="true"><use href="#i-faixa-depois"/></svg></button>
    </div>
    <div class="linha-tempo">
      <span id="tempo-agora">0:00</span>
      <span class="trilho-caixa">
        <input type="range" id="trilho" min="0" max="1000" value="0" aria-label="Posição na faixa">
        <span id="passo-conta" class="passo-conta" aria-hidden="true"></span>
      </span>
      <span id="tempo-total">0:00</span>
    </div>
  </div>
  <div class="ritmo">
    <span class="vel" role="group" aria-label="Velocidade">
      <button type="button" class="icone" data-vel="-1" aria-label="Mais devagar" title="Mais devagar (−)">−</button>
      <output class="vel-valor">1×</output>
      <button type="button" class="icone" data-vel="1" aria-label="Mais rápido" title="Mais rápido (+)">+</button>
    </span>
    <button type="button" class="icone acelera" aria-pressed="false" aria-label="accelerando" title="accelerando: começa devagar e acelera"><svg aria-hidden="true"><use href="#i-rampa"/></svg></button>
  </div>
</footer>

<script src="dados.js"></script>
<script src="simulacao/algoritmos.js"></script>
<script src="simulacao/palco.js"></script>
<script src="simulacao/instrumentos.js"></script>
<script src="graficos.js"></script>
<script src="fluxograma.js"></script>
<script src="instrumentos.js"></script>
<script src="galeria.js"></script>
</body>
</html>

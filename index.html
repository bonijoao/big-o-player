<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>É complexo, baby?</title>
<meta name="description" content="Algoritmos como discos: cada tema é um álbum, cada algoritmo uma faixa, com as contas de tempo, memória e caminhos medidas rodando o código.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<div class="app">
  <aside class="lateral">
    <a class="marca" href="#">É complexo, baby?<span class="cursor" aria-hidden="true"></span></a>
    <p class="lateral-titulo" id="titulo-albuns">Álbuns</p>
    <nav id="albuns" aria-labelledby="titulo-albuns"></nav>
    <p class="lateral-titulo" id="titulo-instrumentos"><a href="#instrumentos">Instrumentos</a></p>
    <nav id="instrumentos-nav" aria-labelledby="titulo-instrumentos"></nav>
  </aside>
  <main id="conteudo" tabindex="-1"></main>
</div>

<!-- o palco mora fora das rotas: trocar de página não interrompe a faixa -->
<div id="fundo" class="fundo" hidden></div>
<section id="palco" class="palco" data-modo="oculto" aria-label="Simulação da faixa" hidden>
  <div class="palco-barra">
    <span id="palco-titulo" class="palco-titulo"></span>
    <button type="button" id="palco-modo" class="icone" aria-label="Minimizar"></button>
    <button type="button" id="palco-fechar" class="icone" aria-label="Fechar">×</button>
  </div>
  <div class="palco-corpo">
    <canvas id="tela" class="tela" role="img" aria-label="Animação do algoritmo"></canvas>
    <div id="palco-vars" class="palco-vars" aria-label="Variáveis: a linha do pseudocódigo que está rodando e os valores da vez"></div>
  </div>
  <div class="palco-controles">
    <span class="grupo">
      <button type="button" id="passo-antes" class="botao-passo" aria-label="Voltar um passo">◀ passo</button>
      <button type="button" id="passo-depois" class="botao-passo" aria-label="Avançar um passo">passo ▶</button>
      <span id="passo-conta" class="passo-conta" aria-live="off"></span>
    </span>
    <label class="so-ordenacao">entrada
      <select id="cfg-tipo">
        <option value="padrao">a do encarte</option>
        <option value="aleatorio">aleatória</option>
        <option value="ordenado">já ordenada</option>
        <option value="invertido">invertida</option>
      </select>
    </label>
    <label class="so-ordenacao">n
      <select id="cfg-n"><option>8</option><option>16</option><option selected>24</option><option>32</option><option>48</option><option>64</option></select>
    </label>
    <label class="so-kmeans">k
      <select id="cfg-k"><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
    </label>
    <button type="button" id="cfg-sortear" class="botao-passo">embaralhar</button>
    <label>velocidade
      <select id="cfg-vel"><option value="0.25">0,25×</option><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16×</option></select>
    </label>
    <button type="button" id="cfg-acelera" class="botao-passo alterna" aria-pressed="false" title="Começa devagar e acelera">accelerando</button>
  </div>
</section>

<footer class="tocador" id="tocador" aria-label="Player">
  <a class="agora" id="agora" href="#">
    <span class="agora-capa" id="agora-capa"></span>
    <span class="agora-texto"><b id="agora-nome">Nada tocando</b><small id="agora-album">escolha uma faixa</small></span>
  </a>
  <div class="controles">
    <div class="botoes">
      <button type="button" id="anterior" class="icone" aria-label="Faixa anterior">⏮</button>
      <button type="button" id="tocar" class="tocar" aria-label="Tocar">▶</button>
      <button type="button" id="proxima" class="icone" aria-label="Próxima faixa">⏭</button>
    </div>
    <div class="linha-tempo">
      <span id="tempo-agora">0:00</span>
      <input type="range" id="trilho" min="0" max="1000" value="0" aria-label="Posição na faixa">
      <span id="tempo-total">0:00</span>
    </div>
  </div>
  <div class="medidor" id="medidor"></div>
</footer>

<script src="dados.js"></script>
<script src="simulacao/algoritmos.js"></script>
<script src="simulacao/palco.js"></script>
<script src="simulacao/instrumentos.js"></script>
<script src="graficos.js"></script>
<script src="fluxograma.js"></script>
<script src="instrumentos.js"></script>
<script src="galeria.js"></script>
</body>
</html>
